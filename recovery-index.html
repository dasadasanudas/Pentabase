        try {
          var theme = localStorage.getItem('pentabaseTheme');
          var isDark =
            theme === 'dark' ||
            (theme !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.dataset.theme = 'dark';
          }
        } catch (error) {
          console.error('Error getting theme from localStorage:', error);
        }
      })();
